<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pergoala GitHub organization avatar">
  <title>github.com/pergoala Avatar</title>
  <defs>
    <linearGradient id="gh-av-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141B26"/>
      <stop offset="100%" stop-color="#0B0F15"/>
    </linearGradient>
    <radialGradient id="gh-av-glow" cx="74%" cy="24%" r="54%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gh-av-vine" x1="120" y1="400" x2="400" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E8A5E"/>
      <stop offset="60%" stop-color="#24B47E"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <!-- Full square canvas safe for both GitHub rounded-square org avatar and circular crop -->
  <rect width="512" height="512" fill="url(#gh-av-bg)"/>
  <rect width="512" height="512" fill="url(#gh-av-glow)"/>

  <!-- Circle-safe inner framing ring -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="#223044" stroke-width="2" stroke-dasharray="6 10" opacity="0.65"/>

