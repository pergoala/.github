<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Pergoala GitHub header banner light">
  <title>Pergoala Development Methodology — GitHub Header (Light)</title>
  <defs>
    <linearGradient id="gh-bg-l" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7F6F2"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F3"/>
    </linearGradient>
    <radialGradient id="gh-glow-l1" cx="82%" cy="32%" r="42%">
      <stop offset="0%" stop-color="#0E8A5E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0E8A5E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gh-vine-l" x1="12" y1="54" x2="52" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B6E4B"/>
      <stop offset="60%" stop-color="#0E8A5E"/>
      <stop offset="100%" stop-color="#19A974"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="url(#gh-bg-l)" stroke="#DCE3EA"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="url(#gh-glow-l1)"/>

  <!-- Architectural pergola lattice (right half) -->
  <g stroke="#CBD5E1" stroke-width="1.3">
    <line x1="740" y1="56" x2="1220" y2="56" stroke="#94A3B8" stroke-width="2.2"/>
    <line x1="760" y1="36" x2="1200" y2="36" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="800" y1="36" x2="800" y2="284"/>
    <line x1="910" y1="36" x2="910" y2="284"/>
    <line x1="1020" y1="36" x2="1020" y2="284"/>
    <line x1="1130" y1="36" x2="1130" y2="284"/>
    <line x1="780" y1="140" x2="1180" y2="140" stroke-dasharray="4 6"/>
    <line x1="780" y1="224" x2="1180" y2="224" stroke-dasharray="4 6"/>
  </g>

  <path d="M775 268 C820 242, 855 210, 910 185 C965 160, 985 112, 1045 96 C1088 84, 1118 72, 1152 46"
        fill="none" stroke="#0E8A5E" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M845 264 C895 232, 955 220, 1020 176 C1065 145, 1105 112, 1152 46"
        fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" opacity="0.55"/>

  <g font-family="'JetBrains Mono', 'Cascadia Code', monospace" font-size="11" font-weight="600">
    <circle cx="800" cy="252" r="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.4"/>
    <text x="800" y="299" text-anchor="middle" fill="#1D4ED8">01 ASKED</text>

    <circle cx="910" cy="185" r="5" fill="#FFFFFF" stroke="#0E8A5E" stroke-width="2.4"/>
    <text x="910" y="299" text-anchor="middle" fill="#0B6E4B">02 AGREED</text>

    <circle cx="1020" cy="108" r="5" fill="#FFFFFF" stroke="#C27B0A" stroke-width="2.4"/>
    <text x="1020" y="299" text-anchor="middle" fill="#9A5B06">03 TRUE NOW</text>

    <circle cx="1130" cy="64" r="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.4"/>
    <text x="1130" y="299" text-anchor="middle" fill="#6D28D9">04 WHO ACTS</text>
  </g>

  <circle cx="1154" cy="44" r="14" fill="#D98A1A" opacity="0.18"/>
  <circle cx="1154" cy="44" r="6" fill="#D98A1A"/>

  <g transform="translate(64, 62) scale(1.65)">
    <g stroke="#64748B" stroke-width="2.4" stroke-linecap="round">
      <line x1="13" y1="11" x2="51" y2="11" stroke="#475569" stroke-width="2.2"/>
      <line x1="18" y1="11" x2="18" y2="18"/>
      <line x1="27.3" y1="11" x2="27.3" y2="18"/>
      <line x1="36.7" y1="11" x2="36.7" y2="18"/>
      <line x1="46" y1="11" x2="46" y2="18"/>
    </g>
    <path d="M7 18 H57" stroke="#141921" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 18 V54" stroke="#1E293B" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M46 18 V54" stroke="#1E293B" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M18 35 H46" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"/>
    <path d="M14 53 C18 46, 20 39, 27 35 C34 31, 41 28, 46 21 C48 18, 50 15, 52 11" fill="none" stroke="url(#gh-vine-l)" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M23 38 C20 33, 22 27, 28 26 C28 31, 26 35, 23 38 Z" fill="#0E8A5E" opacity="0.9"/>
    <circle cx="18" cy="46.5" r="2.2" fill="#F7F6F2" stroke="#0E8A5E" stroke-width="1.8"/>
    <circle cx="46" cy="21" r="2.2" fill="#F7F6F2" stroke="#0E8A5E" stroke-width="1.8"/>
    <circle cx="53" cy="10" r="5" fill="#D98A1A" opacity="0.24"/>
    <circle cx="53" cy="10" r="3.2" fill="#D98A1A"/>
  </g>

  <g font-family="'Space Grotesk', 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif">
    <text x="196" y="122" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#141921">Per<tspan fill="#0E8A5E">goala</tspan></text>
    <text x="198" y="152" font-size="14" font-weight="600" letter-spacing="3.2" fill="#64748B">DEVELOPMENT METHODOLOGY</text>
    <text x="68" y="216" font-size="20" font-weight="400" fill="#334155">Light structure in the right place — so software and AI</text>
    <text x="68" y="244" font-size="20" font-weight="400" fill="#334155">grow together, <tspan fill="#C27B0A" font-weight="600">goal by goal</tspan>.</text>
  </g>

  <rect x="68" y="266" width="144" height="26" rx="13" fill="#E6F6EF" stroke="#A7E3CA"/>
  <text x="140" y="283" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#0B6E4B">pergoala.dev</text>

  <rect x="224" y="266" width="176" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="312" y="283" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#475569">open methodology</text>
</svg>
