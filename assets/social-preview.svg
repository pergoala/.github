<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Pergoala GitHub Social Preview OpenGraph Card">
  <title>Pergoala Development Methodology — GitHub Social Preview (1280x640)</title>
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F15"/>
      <stop offset="55%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#0C141A"/>
    </linearGradient>
    <radialGradient id="og-glow-1" cx="78%" cy="30%" r="48%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow-2" cx="20%" cy="82%" r="36%">
      <stop offset="0%" stop-color="#5B9BFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5B9BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-vine" x1="12" y1="54" x2="52" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E8A5E"/>
      <stop offset="60%" stop-color="#24B47E"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#og-bg)"/>
  <rect width="1280" height="640" fill="url(#og-glow-1)"/>
  <rect width="1280" height="640" fill="url(#og-glow-2)"/>

  <!-- Fine blueprint coordinate grid -->
  <g stroke="#1B2534" stroke-width="1" opacity="0.65">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Right architectural Pergola Sculpture -->
  <g transform="translate(800, 118) scale(6.1)">
    <g stroke="#475569" stroke-width="2.1" stroke-linecap="round">
      <line x1="13" y1="11" x2="51" y2="11" stroke="#94A3B8" stroke-width="1.9"/>
      <line x1="18" y1="11" x2="18" y2="18"/>
      <line x1="27.3" y1="11" x2="27.3" y2="18"/>
      <line x1="36.7" y1="11" x2="36.7" y2="18"/>
      <line x1="46" y1="11" x2="46" y2="18"/>
    </g>
    <path d="M7 18 H57" stroke="#F1F5F9" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M18 18 V54" stroke="#E2E8F0" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M46 18 V54" stroke="#E2E8F0" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M18 35 H46" stroke="#334155" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 4"/>
    <path d="M14 53 C18 46, 20 39, 27 35 C34 31, 41 28, 46 21 C48 18, 50 15, 52 11" fill="none" stroke="url(#og-vine)" stroke-width="4" stroke-linecap="round"/>
    <path d="M23 38 C20 33, 22 27, 28 26 C28 31, 26 35, 23 38 Z" fill="#34D399" opacity="0.9"/>
    <circle cx="18" cy="46.5" r="2.1" fill="#0B0F15" stroke="#34D399" stroke-width="1.6"/>
    <circle cx="46" cy="21" r="2.1" fill="#0B0F15" stroke="#34D399" stroke-width="1.6"/>
    <circle cx="53" cy="10" r="5.5" fill="#F5B84B" opacity="0.24"/>
    <circle cx="53" cy="10" r="3.2" fill="#F5B84B"/>
  </g>

  <!-- Left Typography & Pillars -->
  <g font-family="'Space Grotesk', 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif">
    <rect x="84" y="84" width="228" height="34" rx="17" fill="#132622" stroke="#1E4D3E"/>
    <circle cx="105" cy="101" r="4.5" fill="#34D399"/>
    <text x="120" y="106" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#6EE7B7">github.com/pergoala</text>

    <text x="84" y="218" font-size="88" font-weight="700" letter-spacing="-2.4" fill="#F8FAFC">Per<tspan fill="#34D399">goala</tspan></text>
    <text x="88" y="260" font-size="19" font-weight="600" letter-spacing="4.2" fill="#94A3B8">DEVELOPMENT METHODOLOGY</text>

    <text x="86" y="344" font-size="29" font-weight="400" fill="#E2E8F0">Strict where change is expensive.</text>
    <text x="86" y="384" font-size="29" font-weight="400" fill="#E2E8F0">Loose where it is cheap.</text>
    <text x="86" y="432" font-size="21" font-weight="400" fill="#94A3B8">An open methodology for teams building software with AI.</text>
  </g>

  <!-- Four Questions Strip -->
  <g transform="translate(86, 496)" font-family="'JetBrains Mono', monospace" font-size="13.5">
    <rect x="0" y="0" width="154" height="40" rx="10" fill="#152238" stroke="#2B4C7E"/>
    <circle cx="18" cy="20" r="4" fill="#5B9BFF"/>
    <text x="32" y="25" fill="#BBD4FF">What was asked</text>

    <rect x="168" y="0" width="166" height="40" rx="10" fill="#112822" stroke="#1F5C48"/>
    <circle cx="186" cy="20" r="4" fill="#34D399"/>
    <text x="200" y="25" fill="#A7EACB">What was agreed</text>

    <rect x="348" y="0" width="168" height="40" rx="10" fill="#2B2110" stroke="#6B4F19"/>
    <circle cx="366" cy="20" r="4" fill="#F5B84B"/>
    <text x="380" y="25" fill="#F5D08A">What is true now</text>

    <rect x="530" y="0" width="156" height="40" rx="10" fill="#211A3B" stroke="#4D3B8A"/>
    <circle cx="548" cy="20" r="4" fill="#A78BFA"/>
    <text x="562" y="25" fill="#D6C7FF">Who acts next</text>
  </g>

  <text x="86" y="592" font-family="'JetBrains Mono', monospace" font-size="15" fill="#64748B">pergoala.dev  ·  spine-0  ·  built goal by goal</text>
</svg>
